<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play Vídeos</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0713;--surf:#151024;--ink:#efe9ff;--mute:#9a8fb8;--line:#2a2142;--g1:#6d28d9;--g2:#8b5cf6;--g3:#2a1b4d;--side:#05030a;--sideink:#e9e1ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Inter,sans-serif;margin:0;letter-spacing:-.02em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--sideink);padding:28px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:28px}
.brand{font:800 22px 'Bricolage Grotesque',sans-serif}
nav{display:flex;flex-direction:column;gap:4px}
nav button{background:none;border:0;color:inherit;text-align:left;padding:10px 12px;border-radius:10px;opacity:.75}
nav button.on,nav button:hover{background:rgba(255,255,255,.1);opacity:1}
main{padding:32px clamp(16px,4vw,48px) 48px;max-width:1100px;width:100%}
.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.05;font-weight:800;max-width:14ch}
.hero p{color:var(--mute);max-width:46ch;margin:12px 0 28px}
.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.model{border-radius:22px;padding:24px;border:1px solid var(--line);background:var(--surf);text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:10px;min-height:190px;transition:transform .2s,border-color .2s}
.model:hover{transform:translateY(-3px);border-color:var(--g2)}
.model.big{background:var(--g1);color:#fff;border-color:transparent}
.model.big small{color:#d9c8ff}
.model h3{font-size:24px}
.model small{color:var(--mute);font-size:14px}
.model .go{margin-top:auto;font-weight:600}
.tag{align-self:flex-start;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--g3);color:var(--g1)}
.model.big .tag{background:rgba(255,255,255,.18);color:#fff}
section{margin-top:44px}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.head h2{font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.thumb{aspect-ratio:16/10;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;color:#fff;font:700 13px Inter}
.thumb.d{background:linear-gradient(135deg,#4c1d95,#a78bfa)}
.info{padding:12px 14px}
.info b{display:block;font-weight:600}
.info span{color:var(--mute);font-size:13px}
.bar{height:6px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g2);transition:width .4s}
dialog{border:0;border-radius:22px;padding:26px;width:min(460px,92vw);background:var(--surf);color:var(--ink)}
dialog::backdrop{background:rgba(5,20,13,.55)}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
input,textarea,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:10px;margin-top:22px;justify-content:flex-end}
.btn{padding:11px 20px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--ink)}
.btn.p{background:var(--g2);border-color:var(--g2);color:#fff;font-weight:600}
.vid{width:100%;aspect-ratio:9/16;background:#000;display:block}.tabbar{display:none}
@media (max-width:760px){
.app{display:block}aside{display:none}
main{padding-bottom:96px}
.tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--side);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:5}
.tabbar button{background:none;border:0;color:var(--sideink);padding:10px 14px;border-radius:10px;opacity:.8}
.tabbar button.on{background:rgba(255,255,255,.14);opacity:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside>
<div class="brand">Play Vídeos</div>
<nav><button class="on">Início</button><button>Novo vídeo</button><button>Projetos</button><button>Modelos</button></nav>
</aside>
<main>
<div class="hero">
<h1>Que vídeo vamos criar hoje?</h1>
<p>Escolha um modelo, descreva a ideia e o painel gera o vídeo para você.</p>
</div>
<div class="models">
<button class="model big" data-m="3d"><span class="tag">Modelo 1</span><h3>Vídeo 3D</h3><small>Explicativo vertical em 3D, no formato problema e solução. Usa a skill Remotion.</small><span class="go">Criar vídeo 3D</span></button>
<button class="model" data-m="dinamico"><span class="tag">Modelo 2</span><h3>Vídeo dinâmico</h3><small>Cortes rápidos, textos animados e legendas no ritmo de Shorts, Reels e TikTok.</small><span class="go">Criar vídeo dinâmico</span></button>
</div>
<section>
<div class="head"><h2>Últimos projetos</h2><span id="count" style="color:var(--mute);font-size:14px"></span></div>
<div class="grid" id="list"></div>
</section>
</main>
</div>
<div class="tabbar"><button class="on">Início</button><button data-m="3d">Novo</button><button>Projetos</button></div>

<dialog id="dlg">
<h2 id="dt">Novo vídeo</h2>
<label for="tema">Tema do vídeo</label>
<textarea id="tema" rows="3" placeholder="Ex.: como funciona um poço artesiano"></textarea>
<label for="dur">Duração</label>
<select id="dur"><option>30 segundos</option><option selected>60 segundos</option><option>90 segundos</option></select>
<div class="row"><button class="btn" id="cancel">Cancelar</button><button class="btn p" id="ok">Gerar vídeo</button></div>
</dialog>

<script src="config.js"></script>
<script>
var CFG=window.CONFIG||{},projects=[],pending=[],model="3d",dlg=document.getElementById("dlg");
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){}return null;}
function load(){fetch("videos/index.json?"+Date.now()).then(function(r){return r.json();}).then(function(j){projects=j;pending=pending.filter(function(p){return !j.some(function(x){return x.id===p.id;});});draw();}).catch(draw);}
function draw(){
  var l=document.getElementById("list");l.innerHTML="";
  pending.concat(projects).forEach(function(x){
    var c=document.createElement("div");c.className="card";
    c.innerHTML=(x.arquivo?'<video class="vid" controls playsinline preload="metadata"></video>':'<div class="thumb'+(x.modelo==="3D"?"":" d")+'">Gerando...</div>')+'<div class="info"><b></b><span></span></div>';
    if(x.arquivo)c.querySelector("video").src=x.arquivo;
    c.querySelector("b").textContent=x.titulo;
    c.querySelector("span").textContent=x.modelo+(x.arquivo?" · Pronto":" · Leva alguns minutos");
    l.appendChild(c);
  });
  document.getElementById("count").textContent=(pending.length+projects.length)+" projetos";
}
function open(m){model=m;document.getElementById("dt").textContent="Novo "+(m==="3d"?"vídeo 3D":"vídeo dinâmico");dlg.showModal();}
document.querySelectorAll("[data-m]").forEach(function(b){b.addEventListener("click",function(){open(b.dataset.m.toLowerCase()==="3d"?"3d":"dinamico");});});
document.getElementById("cancel").onclick=function(){dlg.close();};
document.getElementById("ok").onclick=function(){
  var t=document.getElementById("tema").value.trim();
  if(!t){document.getElementById("tema").focus();return;}
  if(!CFG.WORKER_URL){alert("Falta configurar o Worker em docs/config.js (veja o README).");return;}
  var key=ls("pv_key")||prompt("Chave de acesso:");if(!key)return;
  var id="v"+Date.now().toString(36),btn=this;btn.disabled=true;
  fetch(CFG.WORKER_URL,{method:"POST",headers:{"content-type":"application/json","x-app-key":key},body:JSON.stringify({id:id,modelo:model,tema:t})})
  .then(function(r){if(!r.ok)throw new Error(r.status);ls("pv_key",key);pending.unshift({id:id,titulo:t,modelo:model==="3d"?"3D":"Dinâmico"});dlg.close();document.getElementById("tema").value="";draw();})
  .catch(function(){alert("Não foi possível enviar o pedido. Confira a chave e o Worker.");}).then(function(){btn.disabled=false;});
};
load();setInterval(load,20000);
</script>
</body>
</html>
