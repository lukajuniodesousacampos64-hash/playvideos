name: Gerar vídeo
on:
  workflow_dispatch:
    inputs:
      id: {description: "ID do pedido", required: true}
      modelo: {description: "3d ou dinamico", required: true}
      tema: {description: "Tema do vídeo", required: true}
permissions:
  contents: write
concurrency:
  group: videos
  cancel-in-progress: false
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          pip install pillow numpy
      - name: Gerar
        env:
          ID: ${{ inputs.id }}
          MODELO: ${{ inputs.modelo }}
          TEMA: ${{ inputs.tema }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python gerar.py --id "$ID" --modelo "$MODELO" --tema "$TEMA"
      - name: Salvar
        run: |
          git config user.name "play-videos"; git config user.email "bot@users.noreply.github.com"
          git add docs/videos; git commit -m "Novo vídeo"
          git pull --rebase; git push
